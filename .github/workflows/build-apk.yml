name: Build APK (branch temporaneo)

on:
  push:
    branches: [build-toto-eduardo]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Catalogo (RaiPlay, Mediaset Infinity, LA7, YouTube)
        continue-on-error: true
        run: |
          pip install --quiet yt-dlp
          timeout 20m python3 scripts/scrape_catalog.py | tee scansione.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -40 scansione.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache assembleRelease
          cp app/build/outputs/apk/release/app-release.apk toto-eduardo-decrescenzo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: toto-eduardo-decrescenzo-apk
          path: |
            toto-eduardo-decrescenzo.apk
            app/src/main/assets/catalogo.json
            scansione.log
